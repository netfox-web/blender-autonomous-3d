<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>試產工單與看板</title><link rel="stylesheet" href="/admin/recipes/assets/fox3d-shell.css"><script defer src="/admin/recipes/assets/fox3d-shell.js"></script><link rel="stylesheet" href="/admin/pages/assets/pilot.css"><script defer src="/admin/pages/assets/pilot.js"></script></head><body><main>
<header><h1>試產工單與看板</h1><p>查看工單、批次與庫存，記錄收料和請購。資料狀態依系統回覆顯示。</p><label>租戶 <input id="tenant" value="sonaqueen-home"></label> <button id="refresh">重新整理</button></header>
<section><h2>總覽與健康狀態</h2><div id="overview">載入中…</div><h3>材料庫存</h3><div id="lots">載入中…</div><div id="health">載入中…</div></section>
<section><h2>工單列表</h2><div id="orders">載入中…</div><h3>工單明細</h3><div id="detail">請選擇工單。</div><div id="actions" hidden><button data-action="reserve">預留材料</button><button data-action="consume">耗用預留材料</button><button data-action="complete">工單完工</button></div></section>
<section><h2>批次看板</h2><div id="board">載入中…</div><h3>批次列表</h3><div id="batches">載入中…</div><h3>批次明細</h3><pre id="batch-detail">請選擇批次。</pre></section>
<section><h2>收料</h2><p>收料會增加庫存；不符預期的材料會隔離。</p><form id="receipt"><label>材料代碼<input name="material" required></label><label>數量<input name="quantity" type="number" min="1" required></label><label>厚度（mm）<input name="thickness" type="number" min="0.01" step="any" value="18" required></label><label>供應商批號<input name="supplierLot" required></label><button>檢查並收料</button></form><h3>收料紀錄</h3><div id="receipts"></div></section>
<section><h2>請購草稿</h2><p>建立草稿後仍須人工核准；不會自動下單。</p><form id="purchase"><label>材料代碼<input name="material" required></label><label>數量<input name="quantity" type="number" min="1" required></label><button>檢查並建立草稿</button></form><h3>請購紀錄</h3><div id="requests"></div></section>
<section><h2>匯入與匯出</h2><p>匯入資料為 JSON；收料匯入會更新庫存。</p><form id="import"><label>資料種類<select name="schemaVersion"><option value="fox3d.receipt.v1">收料</option><option value="fox3d.supplier_quote.v1">供應商報價</option><option value="fox3d.carrier_quote.v1">運費報價</option><option value="fox3d.inventory_adjustment.v1">庫存調整草稿</option></select></label><label>資料列（JSON 陣列）<textarea name="rows" required placeholder='[{"material":"PB_18_WHITE","quantity":1}]'></textarea></label><button>檢查並匯入</button></form><label>放行識別碼（選填）<input id="release"></label> <button id="export">查看匯出資料</button><button id="download" hidden>下載匯出 JSON</button><pre id="export-result" aria-live="polite"></pre></section>
<section id="confirmation" hidden><h2>確認操作</h2><p id="confirm-text"></p><pre id="confirm-data"></pre><button id="confirm">確認送出</button> <button id="cancel">取消</button></section><section><h2>操作結果</h2><pre id="result" aria-live="polite">尚無操作。</pre></section>
</main></body></html>
