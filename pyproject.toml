[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fox3d"
version = "0.1.0"
description = "Blender Autonomous 3D / Product R&D Engine — capability layer on FoxStudio + GPU Fleet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.6",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.11", "mypy>=1.13"]

[project.scripts]
fox3d = "fox3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fox3d = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".fox3d-work", "build", "dist"]

[tool.ruff.lint]
# Light gate for current main. Broader style/pyflakes rules already fail
# without a reformat, so they are not selected here.
select = ["E9", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
files = ["src", "scripts", "services", "tests"]
# Modules below already fail mypy 2.4 on main b8c6fe9 once pyproject
# dependencies are installed (the CI `pip install -e ".[dev]"` environment,
# including pydantic). They stay ignored so this gate can run without a
# repo-wide type rewrite. Every other module is typechecked. A new module
# is checked unless added here.
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = [
  "fox3d.admin",
  "fox3d.artwork",
  "fox3d.blender",
  "fox3d.capabilities",
  "fox3d.catalog_recipes",
  "fox3d.content_factory",
  "fox3d.contracts",
  "fox3d.cyclecount",
  "fox3d.factory",
  "fox3d.generative_gateway",
  "fox3d.identity",
  "fox3d.infra",
  "fox3d.inventory",
  "fox3d.kd",
  "fox3d.logistics",
  "fox3d.manual_pilot",
  "fox3d.manufacturing",
  "fox3d.media",
  "fox3d.mfg_release",
  "fox3d.outbox",
  "fox3d.packaging",
  "fox3d.packv2",
  "fox3d.parametric",
  "fox3d.physical_os",
  "fox3d.pilot",
  "fox3d.pilot_batch",
  "fox3d.pilot_econ",
  "fox3d.platform",
  "fox3d.portfolio",
  "fox3d.product_truth",
  "fox3d.prototype",
  "fox3d.publish",
  "fox3d.qc",
  "fox3d.receipt",
  "fox3d.recipe_3d",
  "fox3d.recipe_workbench",
  "fox3d.recovery",
  "fox3d.release",
  "fox3d.sandbox",
  "fox3d.station",
  "fox3d.storelock",
  "fox3d.supplier",
  "fox3d.workorder",
  "scripts.blender_job",
  "scripts.run_artwork_placement_e2e",
  "scripts.run_pilot_deploy_e2e",
  "scripts.run_product_content_e2e",
  "scripts.run_product_truth_render_e2e",
  "tests.test_content_factory",
  "tests.test_prototype_runner",
  "tests.test_recipe_admin_runner",
  "tests.test_supervisor",
  "services.supervisor.github_client",
  "services.supervisor.models",
]
ignore_errors = true
