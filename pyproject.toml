[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fox3d"
version = "0.1.0"
description = "Blender Autonomous 3D / Product R&D Engine — capability layer on FoxStudio + GPU Fleet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.6",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "Pillow>=11.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "httpx>=0.27",
  "filelock>=3.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fox3d = "fox3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fox3d = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
