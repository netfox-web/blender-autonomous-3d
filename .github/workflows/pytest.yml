name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-required:
    name: required / Linux / Python 3.12
    runs-on: [self-hosted, Linux, X64, cpu, netfox-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require runner-provided Python 3.12
        shell: bash
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Create isolated virtual environment
        shell: bash
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install -e ".[dev]"
      - name: Lint and type-check
        run: |
          .ci-venv/bin/ruff check .
          .ci-venv/bin/mypy
      - name: Unit / regression tests
        run: .ci-venv/bin/pytest -q
        env:
          FOX3D_MOCK_BLENDER: "1"

  windows-required:
    name: required / Windows / BLOCKED — no authorized runner
    runs-on: [self-hosted, Linux, X64, cpu, netfox-ci]
    timeout-minutes: 5
    steps:
      - name: Block overall success until Windows coverage is restored
        shell: bash
        run: |
          echo "::error::Windows required gate is BLOCKED: no authorized online Windows runner is registered."
          echo "Linux results do not satisfy or replace the Windows requirement."
          exit 1
