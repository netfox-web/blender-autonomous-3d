name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-required:
    name: required / Linux / Python 3.12
    runs-on: [self-hosted, Linux, X64, cpu, netfox-ci]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build verified job-local Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python_version=3.12.15
          python_sha256=de1a241a519e0a3374fea98988d0b52c886743f9d953f23be8269cc7b59c5fab
          zlib_version=1.3.2
          zlib_sha256=bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
          openssl_version=3.5.9
          openssl_sha256=603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          sqlite_version=3.54.1
          sqlite_archive_version=3540100
          sqlite_sha3_256=b6ced585c750916b1052667239a12c25a7ff34e7f06e1e6e01ecb0427657d9c4
          runtime_root="$RUNNER_TEMP/fox3d-python-$python_version"
          source_root="$RUNNER_TEMP/fox3d-python-source-$python_version"
          zlib_prefix="$runtime_root/zlib"
          openssl_prefix="$runtime_root/openssl"
          sqlite_prefix="$runtime_root/sqlite"
          python_prefix="$runtime_root/cpython"

          rm -rf "$runtime_root" "$source_root"
          mkdir -p "$runtime_root" "$source_root"
          cd "$source_root"

          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "zlib-$zlib_version.tar.gz" \
            "https://zlib.net/zlib-$zlib_version.tar.gz"
          echo "$zlib_sha256  zlib-$zlib_version.tar.gz" | sha256sum --check --strict
          tar -xzf "zlib-$zlib_version.tar.gz"
          cd "zlib-$zlib_version"
          ./configure --prefix="$zlib_prefix"
          make -j2
          make install

          cd "$source_root"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "openssl-$openssl_version.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-$openssl_version/openssl-$openssl_version.tar.gz"
          echo "$openssl_sha256  openssl-$openssl_version.tar.gz" | sha256sum --check --strict
          tar -xzf "openssl-$openssl_version.tar.gz"
          cd "openssl-$openssl_version"
          ./Configure \
            --prefix="$openssl_prefix" \
            --openssldir="$openssl_prefix/ssl" \
            --libdir=lib \
            shared \
            no-tests
          make -j2
          make install_sw

          cd "$source_root"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "sqlite-autoconf-$sqlite_archive_version.tar.gz" \
            "https://www.sqlite.org/2026/sqlite-autoconf-$sqlite_archive_version.tar.gz"
          sqlite_actual_sha3_256="$(
            LD_LIBRARY_PATH="$openssl_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$openssl_prefix/bin/openssl" dgst -sha3-256 \
                "sqlite-autoconf-$sqlite_archive_version.tar.gz" | awk '{print $2}'
          )"
          if [ "$sqlite_actual_sha3_256" != "$sqlite_sha3_256" ]; then
            echo "SQLite $sqlite_version SHA3-256 mismatch" >&2
            exit 1
          fi
          tar -xzf "sqlite-autoconf-$sqlite_archive_version.tar.gz"
          cd "sqlite-autoconf-$sqlite_archive_version"
          ./configure \
            --prefix="$sqlite_prefix" \
            --disable-shared \
            --enable-static
          make -j2
          make install

          cat > sqlite-link-probe.c <<'C'
          #include <sqlite3.h>

          int main(void) {
              sqlite3 *database = 0;
              if (sqlite3_open(":memory:", &database) != SQLITE_OK) {
                  return 1;
              }
              return sqlite3_close(database) == SQLITE_OK ? 0 : 1;
          }
          C
          cc \
            -I"$sqlite_prefix/include" \
            sqlite-link-probe.c \
            "$sqlite_prefix/lib/libsqlite3.a" \
            -L"$zlib_prefix/lib" \
            -Wl,-rpath,"$zlib_prefix/lib" \
            -lz -lm -ldl -lpthread \
            -o sqlite-link-probe
          ./sqlite-link-probe

          cd "$source_root"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "Python-$python_version.tgz" \
            "https://www.python.org/ftp/python/$python_version/Python-$python_version.tgz"
          echo "$python_sha256  Python-$python_version.tgz" | sha256sum --check --strict
          tar -xzf "Python-$python_version.tgz"
          cd "Python-$python_version"
          CPPFLAGS="-I$zlib_prefix/include -I$sqlite_prefix/include" \
            LDFLAGS="-L$zlib_prefix/lib -L$sqlite_prefix/lib" \
            LIBSQLITE3_CFLAGS="-I$sqlite_prefix/include" \
            LIBSQLITE3_LIBS="-L$sqlite_prefix/lib -lsqlite3 -L$zlib_prefix/lib -Wl,-rpath,$zlib_prefix/lib -lz -lm -ldl -lpthread" \
            ./configure \
              --prefix="$python_prefix" \
              --with-ensurepip=install \
              --with-openssl="$openssl_prefix" \
              --with-openssl-rpath=auto
          make -j2
          make install

          "$python_prefix/bin/python3.12" - <<'PY'
          import _ctypes
          import _hashlib
          import _sqlite3
          import _ssl
          import ctypes
          import hashlib
          import io
          import sqlite3
          import ssl
          import sys
          import uuid
          import zipfile
          import zlib

          assert sys.version_info[:2] == (3, 12), sys.version
          assert hashlib.sha256(b"fox3d-ci-preflight").hexdigest()
          assert uuid.uuid4().version == 4
          with sqlite3.connect(":memory:") as connection:
              assert connection.execute("SELECT 21 * 2").fetchone() == (42,)
          payload = b"fox3d-ci-preflight"
          archive_buffer = io.BytesIO()
          with zipfile.ZipFile(archive_buffer, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("probe.txt", payload)
          with zipfile.ZipFile(io.BytesIO(archive_buffer.getvalue())) as archive:
              assert archive.read("probe.txt") == payload
          print(sys.version)
          print(ssl.OPENSSL_VERSION)
          print(sqlite3.sqlite_version)
          print(zlib.ZLIB_VERSION)
          PY
          echo "$python_prefix/bin" >> "$GITHUB_PATH"
          echo "FOX3D_CI_PYTHON=$python_prefix/bin/python3.12" >> "$GITHUB_ENV"
      - name: Create isolated virtual environment
        shell: bash
        run: |
          "$FOX3D_CI_PYTHON" -m venv .ci-venv
          .ci-venv/bin/python -m pip install -e ".[dev]"
      - name: Required Linux gates
        shell: bash
        run: |
          set +e
          .ci-venv/bin/ruff check .
          ruff_status=$?
          .ci-venv/bin/mypy --show-traceback
          mypy_status=$?
          .ci-venv/bin/pytest -q
          pytest_status=$?
          echo "ruff_status=$ruff_status mypy_status=$mypy_status pytest_status=$pytest_status"
          if [ "$ruff_status" -ne 0 ] || [ "$mypy_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
            exit 1
          fi
        env:
          FOX3D_MOCK_BLENDER: "1"
      - name: Remove job-local runtime sources
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/fox3d-python-3.12.15" \
            "$RUNNER_TEMP/fox3d-python-source-3.12.15"

  windows-required:
    name: required / Windows / BLOCKED - no authorized runner
    runs-on: [self-hosted, Linux, X64, cpu, netfox-ci]
    timeout-minutes: 5
    steps:
      - name: Block overall success until Windows coverage is restored
        shell: bash
        run: |
          echo "::error::Windows required gate is BLOCKED: no authorized online Windows runner is registered."
          echo "Linux results do not satisfy or replace the Windows requirement."
          exit 1
