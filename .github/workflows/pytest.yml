name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check .
          mypy
      - name: Unit / regression tests
        run: pytest -q
        env:
          FOX3D_MOCK_BLENDER: "1"
          FOX3D_SKIP_BROWSER: "1"

  legacy-admin-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Legacy admin browser regression tests
        run: python -m pytest tests/test_admin_legacy_assets.py -m browser -q
        env:
          FOX3D_MOCK_BLENDER: "1"
          FOX3D_REQUIRE_LEGACY_BROWSER: "1"
      - name: Browser XSS and smoke tests
        run: python -m pytest tests/browser -m browser -q
        env:
          FOX3D_MOCK_BLENDER: "1"
          FOX3D_REQUIRE_LEGACY_BROWSER: "1"
