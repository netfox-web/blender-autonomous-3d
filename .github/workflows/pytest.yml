name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-required:
    name: required / Linux / Python 3.12
    runs-on: [self-hosted, Linux, X64, cpu, netfox-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pre-provisioned runner Python 3.12 runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "/srv/ci-runner/tool-cache/Python/3.12.14/x64/bin/python3" ]; then
            FOX3D_CI_PYTHON="/srv/ci-runner/tool-cache/Python/3.12.14/x64/bin/python3"
            echo "/srv/ci-runner/tool-cache/Python/3.12.14/x64/bin" >> "$GITHUB_PATH"
          else
            FOX3D_CI_PYTHON="$(command -v python3.12 || command -v python3)"
          fi
          "$FOX3D_CI_PYTHON" - <<'PY'
          import _ctypes
          import _hashlib
          import _sqlite3
          import _ssl
          import ctypes
          import hashlib
          import io
          import sqlite3
          import ssl
          import sys
          import uuid
          import zipfile
          import zlib

          assert sys.version_info[:2] == (3, 12), sys.version
          assert hashlib.sha256(b"fox3d-ci-preflight").hexdigest()
          assert uuid.uuid4().version == 4
          with sqlite3.connect(":memory:") as connection:
              assert connection.execute("SELECT 21 * 2").fetchone() == (42,)
          payload = b"fox3d-ci-preflight"
          archive_buffer = io.BytesIO()
          with zipfile.ZipFile(archive_buffer, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("probe.txt", payload)
          with zipfile.ZipFile(io.BytesIO(archive_buffer.getvalue())) as archive:
              assert archive.read("probe.txt") == payload
          print(sys.version)
          print(ssl.OPENSSL_VERSION)
          print(sqlite3.sqlite_version)
          print(zlib.ZLIB_VERSION)
          PY
          echo "FOX3D_CI_PYTHON=$FOX3D_CI_PYTHON" >> "$GITHUB_ENV"
      - name: Create isolated virtual environment
        shell: bash
        run: |
          "$FOX3D_CI_PYTHON" -m venv .ci-venv
          .ci-venv/bin/python -m pip install -e ".[dev]"
      - name: Required Linux gates
        shell: bash
        run: |
          set +e
          .ci-venv/bin/ruff check .
          ruff_status=$?
          .ci-venv/bin/mypy --show-traceback
          mypy_status=$?
          .ci-venv/bin/pytest -q
          pytest_status=$?
          echo "ruff_status=$ruff_status mypy_status=$mypy_status pytest_status=$pytest_status"
          if [ "$ruff_status" -ne 0 ] || [ "$mypy_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
            exit 1
          fi
        env:
          FOX3D_MOCK_BLENDER: "1"

  windows-required:
    name: required / Windows / BLOCKED - no authorized runner
    runs-on: [self-hosted, Linux, X64, cpu, netfox-ci]
    timeout-minutes: 5
    steps:
      - name: Record Windows BLOCKED status (Owner-approved Linux-only Gate submission for PR #27)
        shell: bash
        run: |
          echo "::warning::windowsRunner=BLOCKED_OWNER_WAIVED_FOR_PR27 (no online Windows runner; Owner approved Linux-only CI for PR #27 Gate submission at 2026-10-24 02:29 TPE)."
          exit 0
